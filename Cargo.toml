[package]
name = "env-guard"
version = "0.1.0"
edition = "2021"
authors = ["Marcus Chen <marcus@marcuschen.dev>"]
description = "Validate environment variables against a schema before running commands"
license = "MIT"
readme = "README.md"
keywords = ["cli", "environment", "validation", "devops"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
regex = "1"
url = "2"